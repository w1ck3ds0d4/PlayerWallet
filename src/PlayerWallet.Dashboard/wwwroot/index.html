<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PlayerWallet Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header>
    <h1>PlayerWallet Comparison Dashboard</h1>
    <div class="muted" id="config-summary">Loading...</div>
  </header>

  <section class="projects" id="projects"></section>

  <section class="controls">
    <h2>Run benchmark</h2>
    <div class="control-row">
      <label>Scenario
        <select id="scenario">
          <option value="get-balance">get-balance</option>
          <option value="add-funds" selected>add-funds</option>
          <option value="deduct-funds">deduct-funds</option>
          <option value="hot-wallet">hot-wallet (single grain)</option>
        </select>
      </label>
      <label>Duration (s)
        <input id="duration" type="number" min="10" max="600" step="5" value="30" style="width: 80px;">
      </label>
      <label>Projects
        <span id="project-checkboxes" class="checkbox-row"></span>
      </label>
      <button id="run" type="button">Run benchmark</button>
      <button id="reset-outboxes" type="button" title="Calls /admin/reset-outbox on every configured project. Only v2 has this endpoint; v1 will report it as unavailable. Use between bench sessions for a clean slate." style="background:#475569;color:#f1f5f9;margin-left:8px;">Reset outboxes</button>
      <span id="run-status" class="muted"></span>
    </div>
  </section>

  <section class="results">
    <h2>Latest result</h2>
    <div id="latest-result" class="empty">Run a benchmark to see numbers here.</div>
  </section>

  <section class="history">
    <h2>Recent runs</h2>
    <div class="muted" id="reports-root" style="margin-bottom: 8px;"></div>
    <table>
      <thead>
        <tr>
          <th>Started</th>
          <th>Scenario</th>
          <th>Projects</th>
          <th>Status</th>
          <th>OK / Fail</th>
          <th>Mean / p95 / p99 ms</th>
          <th>Folder</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </section>

  <script src="dashboard.js"></script>
</body>
</html>
